name: Auto Update Highlights Matches

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Match Sync Script
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: python main.py

      - name: Commit and Push Updated Checkpoint
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_match.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last_match.json checkpoint" && git push)
